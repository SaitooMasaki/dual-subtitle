<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background: #fff;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
      color: #111;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    label {
      font-size: 13px;
      color: #333;
    }
    /* トグルスイッチ */
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      inset: 0;
      background: #ccc;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider {
      background: #e00;
    }
    input:checked + .slider::before {
      transform: translateX(18px);
    }
  </style>
</head>
<body>
  <h1>🎬 DualSubtitle</h1>
  <div class="row">
    <label for="toggle">Show Japanese translation</label>
    <label class="switch">
      <input type="checkbox" id="toggle" />
      <span class="slider"></span>
    </label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
