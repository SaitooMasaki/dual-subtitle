<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Hiragino Sans', sans-serif;
      font-size: 13px;
      background: #fff;
      color: #1a1a1a;
    }

    .popup-header {
      background: #e00;
      color: #fff;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .popup-title { font-weight: 700; font-size: 15px; }
    .version { font-size: 11px; opacity: .7; }

    .section { padding: 14px 16px; border-bottom: 1px solid #f0f0f0; }

    /* トグル行 */
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .row-label { font-weight: 600; color: #333; }

    .switch {
      position: relative; width: 40px; height: 22px; flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #ccc; border-radius: 22px; cursor: pointer;
      transition: background .2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; top: 3px;
      background: #fff; border-radius: 50%;
      transition: transform .2s;
    }
    input:checked + .slider { background: #e00; }
    input:checked + .slider::before { transform: translateX(18px); }

    /* 言語セレクター */
    .lang-label {
      font-size: 11px; font-weight: 700; color: #666;
      text-transform: uppercase; letter-spacing: .4px;
      margin-bottom: 6px;
    }
    select {
      width: 100%;
      padding: 7px 10px;
      border: 1.5px solid #ddd;
      border-radius: 7px;
      font-size: 13px;
      color: #1a1a1a;
      background: #fafafa;
      cursor: pointer;
      outline: none;
    }
    select:focus { border-color: #e00; }
    select:disabled {
      opacity: .5; cursor: not-allowed; background: #f5f5f5;
    }
    .pro-note {
      font-size: 11px; color: #e00;
      margin-top: 5px;
    }

    /* プランバッジ */
    .plan-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .badge {
      font-size: 10px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; text-transform: uppercase;
    }
    .badge-free { background: #f0f0f0; color: #888; }
    .badge-pro  { background: #e00; color: #fff; }

    /* アップグレードバー */
    .upgrade-bar {
      background: #fff5f5; border: 1px solid #fcc;
      border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
      text-align: center;
    }
    .upgrade-bar p { font-size: 12px; color: #666; margin-bottom: 8px; }
    .btn-upgrade {
      display: inline-block;
      background: #e00; color: #fff;
      border: none; border-radius: 6px;
      padding: 7px 16px; font-size: 12px; font-weight: 700;
      cursor: pointer; text-decoration: none;
    }
    .btn-upgrade:hover { background: #c00; }

    /* ライセンス入力 */
    .section-label {
      font-size: 11px; font-weight: 700; color: #888;
      text-transform: uppercase; letter-spacing: .4px;
      margin-bottom: 6px; display: block;
    }
    .input-row { display: flex; gap: 6px; }
    input[type="text"] {
      flex: 1; padding: 6px 10px;
      border: 1.5px solid #ddd; border-radius: 6px;
      font-size: 12px; color: #1a1a1a; outline: none;
      font-family: monospace;
    }
    input[type="text"]:focus { border-color: #e00; }
    .btn-sm {
      background: #1a1a1a; color: #fff;
      border: none; border-radius: 6px;
      padding: 6px 12px; font-size: 11px; font-weight: 700;
      cursor: pointer; white-space: nowrap;
    }
    .btn-sm:hover { background: #333; }
    .btn-sm:disabled { opacity: .5; cursor: not-allowed; }

    /* 保存済み行 */
    .key-saved-row {
      display: flex; align-items: center; justify-content: space-between;
      background: #f0fff0; border: 1px solid #6c6; border-radius: 6px;
      padding: 6px 10px;
    }
    .key-saved-label { font-size: 12px; font-weight: 600; color: #383; }
    .btn-change {
      background: none; border: 1px solid #ccc; border-radius: 5px;
      padding: 2px 8px; font-size: 11px; color: #666; cursor: pointer;
    }

    .status-msg { font-size: 11px; min-height: 16px; margin-top: 4px; }
    .status-ok  { color: #383; }
    .status-err { color: #e00; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="popup-header">
    <span class="popup-title">🎬 DualSubtitle</span>
    <span class="version">v0.2.0</span>
  </div>

  <!-- ON/OFF トグル -->
  <div class="section">
    <div class="row">
      <span class="row-label">翻訳を表示</span>
      <label class="switch">
        <input type="checkbox" id="toggle" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- 翻訳先言語 -->
  <div class="section">
    <div class="lang-label">翻訳先言語</div>
    <select id="lang-select">
      <option value="ja">🇯🇵 日本語（無料）</option>
      <option value="en">🇺🇸 English</option>
      <option value="zh-CN">🇨🇳 中文（簡体）</option>
      <option value="ko">🇰🇷 한국어</option>
      <option value="es">🇪🇸 Español</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="de">🇩🇪 Deutsch</option>
      <option value="pt">🇵🇹 Português</option>
      <option value="ru">🇷🇺 Русский</option>
      <option value="vi">🇻🇳 Tiếng Việt</option>
      <option value="id">🇮🇩 Bahasa Indonesia</option>
      <option value="th">🇹🇭 ภาษาไทย</option>
    </select>
    <p class="pro-note hidden" id="lang-pro-note">🔒 日本語以外は Pro プランが必要です</p>
  </div>

  <!-- プラン -->
  <div class="section">
    <div class="plan-row">
      <span style="color:#666">プラン：</span>
      <span id="plan-badge" class="badge badge-free">Free</span>
      <span id="usage-note" style="font-size:11px;color:#888"></span>
    </div>

    <!-- アップグレードバー（Free のみ表示） -->
    <div id="upgrade-bar" class="upgrade-bar">
      <p>Proにアップグレードして<strong>全言語</strong>を解放</p>
      <a id="upgrade-link" href="#" target="_blank" class="btn-upgrade">Pro → ¥480/月</a>
    </div>

    <!-- ライセンスキー（Free のみ表示） -->
    <div id="license-section">
      <label class="section-label">ライセンスキー</label>

      <div id="key-saved-row" class="key-saved-row hidden">
        <span class="key-saved-label">✅ Pro 有効</span>
        <button id="btn-deactivate" class="btn-change">解除</button>
      </div>

      <div id="key-input-row">
        <div class="input-row">
          <input type="text" id="license-input" placeholder="XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX" autocomplete="off" />
          <button id="btn-activate" class="btn-sm">認証</button>
        </div>
        <p id="license-status" class="status-msg"></p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
